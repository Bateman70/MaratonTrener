name: Daily Training Reminder

on:
  schedule:
    # Run every morning at 05:00 UTC (07:00 Oslo summer time / 06:00 Oslo winter time)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Reminder Script
        run: node scripts/daily_reminder.js
